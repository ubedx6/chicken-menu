<!DOCTYPE html>
<html>

<head>

  <title>Fine Menu Admin</title>

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon"
  href="icons/icon-512.png">

  <meta name="apple-mobile-web-app-capable"
  content="yes">

  <meta name="apple-mobile-web-app-status-bar-style"
  content="black-translucent">

  <meta name="mobile-web-app-capable"
  content="yes">

  <meta name="theme-color"
  content="#00ff99">



<style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  background:
  linear-gradient(
    180deg,
    #07140f,
    #0f0f0f
  );

  color:white;

  padding:20px;

  min-height:100vh;
}



.topBar{

  display:flex;

  align-items:center;

  gap:20px;

  margin-bottom:25px;
}



.logoTitle{

  font-size:28px;

  font-weight:700;

  color:#00ff99;
}



#menuBtn{

  font-size:34px;

  cursor:pointer;

  padding:10px 15px;

  border-radius:15px;

  background:
  rgba(255,255,255,0.05);
}


#sideMenu{

  position:fixed;

  top:0;

  left:-85%;

  width:80%;

  height:100vh;

  background:#111;

  z-index:999999;

  transition:0.35s;

  padding:25px;

  box-shadow:
  10px 0 30px rgba(0,0,0,0.4);
}



#sideMenu.active{

  left:0;
}



.menuHeader{

  font-size:30px;

  font-weight:700;

  color:#00ff99;

  margin-bottom:40px;
}



.menuItem{

  padding:20px;

  border-radius:20px;

  background:
  rgba(255,255,255,0.05);

  margin-bottom:15px;

  font-size:20px;

  cursor:pointer;
}



#settingsScreen{

  position:fixed;

  top:0;

  right:-100%;

  width:100%;

  height:100vh;

  background:#0f0f0f;

  z-index:99999;

  transition:0.35s;

  padding:25px;

  overflow-y:auto;

}



#settingsScreen.active{

  right:0;
}



.settingsHeader{

  display:flex;

  align-items:center;

  gap:20px;

  margin-bottom:30px;
}



#backBtn{

  font-size:32px;

  cursor:pointer;
}



.settingsCard{

  background:
  rgba(255,255,255,0.05);

  border-radius:30px;

  padding:25px;

  position:relative;

  min-height:700px;

  padding-bottom:280px;
}

.settingsCard h3{

  margin-bottom:25px;

  color:#00ff99;
}



#tvPreview{

  position:relative;

  width:100%;

  aspect-ratio:16/9;

  background:
  url('images/page1.jpg');

  background-size:cover;

  background-position:center;

  border-radius:28px;

  overflow:hidden;

  border:
  5px solid #1a1a1a;

  box-shadow:
  0 15px 40px rgba(0,0,0,0.5);
}




.remoteContainer{

  position:fixed;

  bottom:0;

  left:0;

  width:100%;

  padding:25px 20px 35px;

  background:
  rgba(10,10,10,0.96);

  backdrop-filter:blur(20px);

  border-top-left-radius:35px;

  border-top-right-radius:35px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:18px;

  box-shadow:
  0 -10px 40px rgba(0,0,0,0.5);
}



.middleRow{

  display:flex;

  align-items:center;

  gap:25px;
}



.arrowBtn{

  width:90px;

  height:90px;

  border:none;

  border-radius:28px;

  background:
  linear-gradient(
    180deg,
    #1f1f1f,
    #121212
  );

  color:#00ff99;

  font-size:36px;

  font-weight:bold;

  box-shadow:
  0 6px 15px rgba(0,0,0,0.35);

  transition:0.12s;

  cursor:pointer;
}



.arrowBtn:active{

  transform:scale(0.92);

  box-shadow:
  0 0 18px rgba(0,255,153,0.4);
}



#previewPrice{

  position:absolute;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  font-size:42px;

  font-family:'Aprila';

  color:#0b4d00;

  font-weight:bold;

  text-shadow:
  2px 2px 8px rgba(255,255,255,0.4);

  transition:0.15s;
}



#savePositionBtn{

  width:90px;

  height:90px;

  border:none;

  border-radius:28px;

  background:
  linear-gradient(
    180deg,
    #00ff99,
    #00d37f
  );

  color:black;

  font-size:18px;

  font-weight:700;

  box-shadow:
  0 6px 15px rgba(0,255,153,0.25);

  transition:0.12s;
}



#savePositionBtn:active{

  transform:scale(0.92);
}



.card{

  background:
  rgba(255,255,255,0.06);

  backdrop-filter: blur(18px);

  border:
  1px solid rgba(255,255,255,0.08);

  border-radius:30px;

  padding:22px;

  margin-bottom:25px;

  box-shadow:
  0 8px 30px rgba(0,0,0,0.35);

  transition:0.3s;
}



.card:hover{

  transform:translateY(-3px);

  box-shadow:
  0 15px 35px rgba(0,255,153,0.08);
}



.card h2{

  color:#00ff99;

  margin-bottom:22px;

  font-size:24px;

  font-weight:600;
}



.item{

  margin-bottom:22px;
}



label{

  display:block;

  margin-bottom:10px;

  font-size:15px;

  color:#bfbfbf;

  font-weight:500;
}



.inputBox{

  position:relative;
}



.currency{

  position:absolute;

  left:18px;

  top:50%;

  transform:translateY(-50%);

  color:#00ff99;

  font-size:22px;

  font-weight:600;
}



input{

  width:100%;

  padding:
  18px 18px 18px 55px;

  border:none;

  border-radius:18px;

  background:
  rgba(255,255,255,0.05);

  color:white;

  font-size:24px;

  font-weight:600;

  outline:none;

  transition:0.25s;
}



input:focus{

  border:
  2px solid #00ff99;

  background:
  rgba(255,255,255,0.08);

  box-shadow:
  0 0 15px rgba(0,255,153,0.15);
}



.saveBtn{

  position:fixed;

  bottom:20px;

  left:20px;

  right:20px;

  padding:20px;

  border:none;

  border-radius:24px;

  background:
  linear-gradient(
    90deg,
    #00ff99,
    #00d37f
  );

  color:black;

  font-size:22px;

  font-weight:700;

  cursor:pointer;

  box-shadow:
  0 10px 30px rgba(0,255,153,0.35);

  transition:0.3s;
}



.saveBtn:hover{

  transform:scale(1.02);
}



.saveBtn:active{

  transform:scale(0.98);
}



.space{

  height:120px;
}

#overlay{

  position:fixed;

  top:0;

  left:0;

  width:100%;

  height:100vh;

  background:
  rgba(0,0,0,0.5);

  z-index:999998;

  opacity:0;

  pointer-events:none;

  transition:0.3s;
}



#overlay.active{

  opacity:1;

  pointer-events:auto;
}

.tvLink{

  margin-top:10px;

  font-size:20px;

  color:#8f8f8f;

  word-break:break-all;

  font-weight:400;
}


</style>

</head>

<body>



<div class="topBar">

  <div id="menuBtn">

    ☰

  </div>

  <div class="logoTitle">

    🐔 Fine Menu Admin

  </div>

</div>


<div id="overlay"></div>


 <div id="sideMenu">

  <div class="menuHeader">

    Fine Menu

    <div class="tvLink">

      https://amazing-arithmetic-236c52.netlify.app/

    </div>

  </div>



  <div class="menuItem"
  id="displaySettingsBtn">

    📺 Display Settings

  </div>



  <div class="menuItem">

    🎨 Themes

  </div>



  <div class="menuItem">

    ℹ About

  </div>

</div>



<div id="settingsScreen">

  <div class="settingsHeader">

    <div id="backBtn">

      ←

    </div>

    <h2>Display Settings</h2>

  </div>



  <div class="settingsCard">

    <h3>Price Position</h3>



    <div id="tvPreview">

      <div id="previewPrice">

        Rs. 999

      </div>

    </div>



    <div class="remoteContainer">

      <button class="arrowBtn"
      id="upBtn">

        ↑

      </button>



      <div class="middleRow">

        <button class="arrowBtn"
        id="leftBtn">

          ←

        </button>



        <button id="savePositionBtn">

          SAVE

        </button>



        <button class="arrowBtn"
        id="rightBtn">

          →

        </button>

      </div>



      <button class="arrowBtn"
      id="downBtn">

        ↓

      </button>

    </div>

  </div>

</div>



<div class="card">

  <h2>Chicken</h2>

  <div class="item">

    <label>Skinless Chicken</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="skinless" step="10">

    </div>

  </div>



  <div class="item">

    <label>Boneless Chicken</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="boneless" step="10">

    </div>

  </div>



  <div class="item">

    <label>Live Bird</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="liveBird" step="10">

    </div>

  </div>



  <div class="item">

    <label>Liver</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="liver" step="10">

    </div>

  </div>

</div>



<div class="card">

  <h2>Mutton</h2>

  <div class="item">

    <label>With Bones</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="withBones" step="10">

    </div>

  </div>



  <div class="item">

    <label>Boneless</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="muttonBoneless" step="10">

    </div>

  </div>



  <div class="item">

    <label>Botee</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="botee" step="10">

    </div>

  </div>



  <div class="item">

    <label>Leggs</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="leggs" step="10">

    </div>

  </div>

</div>



<div class="card">

  <h2>Eggs</h2>

  <div class="item">

    <label>12 Eggs</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="eggs12">

    </div>

  </div>



  <div class="item">

    <label>Tray Eggs</label>

    <div class="inputBox">

      <span class="currency">₹</span>

      <input type="number" id="trayEggs">

    </div>

  </div>

</div>



<button class="saveBtn"
onclick="savePrices()">

💾 SAVE PRICES

</button>

<div class="space"></div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  update,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyDcR3gYBt_2qBBzQEymUE_pfleZ6k5sdG0",

  authDomain: "fine-chicken-menu.firebaseapp.com",

  databaseURL: "https://fine-chicken-menu-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "fine-chicken-menu",

  storageBucket: "fine-chicken-menu.firebasestorage.app",

  messagingSenderId: "533272602462",

  appId: "1:533272602462:web:0dc1845a368e454fbfd1cf"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const chickenRef = ref(db, 'menu/chicken');

const muttonRef = ref(db, 'menu/mutton');

const eggsRef = ref(db, 'menu/eggs');

const settingsRef =
ref(db,'menu/settings');



onValue(chickenRef, (snapshot)=>{

  const data = snapshot.val();

  document.getElementById("skinless").value =
    data.skinless;

  document.getElementById("boneless").value =
    data.boneless;

  document.getElementById("liveBird").value =
    data.liveBird;

  document.getElementById("liver").value =
    data.liver;

});



onValue(muttonRef, (snapshot)=>{

  const data = snapshot.val();

  document.getElementById("withBones").value =
    data.withBones;

  document.getElementById("muttonBoneless").value =
    data.boneless;

  document.getElementById("botee").value =
    data.botee;

  document.getElementById("leggs").value =
    data.leggs;

});



onValue(eggsRef, (snapshot)=>{

  const data = snapshot.val();

  document.getElementById("eggs12").value =
    data.eggs12;

  document.getElementById("trayEggs").value =
    data.trayEggs;

});


onValue(settingsRef,(snapshot)=>{

  const data = snapshot.val();

  posX = data.x || 0;

  posY = data.y || 0;

  updatePreview();

});



window.savePrices = function(){

  update(chickenRef, {

    skinless:
      document.getElementById("skinless").value,

    boneless:
      document.getElementById("boneless").value,

    liveBird:
      document.getElementById("liveBird").value,

    liver:
      document.getElementById("liver").value

  });



  update(muttonRef, {

    withBones:
      document.getElementById("withBones").value,

    boneless:
      document.getElementById("muttonBoneless").value,

    botee:
      document.getElementById("botee").value,

    leggs:
      document.getElementById("leggs").value

  });



  update(eggsRef, {

    eggs12:
      document.getElementById("eggs12").value,

    trayEggs:
      document.getElementById("trayEggs").value

  });



  alert("Prices Updated!");

}




const menuBtn =
document.getElementById("menuBtn");

const sideMenu =
document.getElementById("sideMenu");

const overlay =
document.getElementById("overlay");

const displaySettingsBtn =
document.getElementById("displaySettingsBtn");

const settingsScreen =
document.getElementById("settingsScreen");

const backBtn =
document.getElementById("backBtn");

const previewPrice =
document.getElementById("previewPrice");

let posX = 0;

let posY = 0;

const upBtn =
document.getElementById("upBtn");

const downBtn =
document.getElementById("downBtn");

const leftBtn =
document.getElementById("leftBtn");

const rightBtn =
document.getElementById("rightBtn");



menuBtn.onclick = ()=>{

  sideMenu
  .classList.add('active');

  overlay
  .classList.add('active');

};



overlay.onclick = ()=>{

  sideMenu
  .classList.remove('active');

  overlay
  .classList.remove('active');

};


displaySettingsBtn.onclick = ()=>{

  sideMenu
  .classList.remove('active');

  settingsScreen
  .classList.add('active');

  overlay
  .classList.remove('active');

};



backBtn.onclick = ()=>{

  settingsScreen
  .classList.remove('active');

};



backBtn.onclick = ()=>{

  settingsScreen
  .classList.remove('active');

};

function updatePreview(){

  previewPrice.style.left =
    posX + 'px';

  previewPrice.style.top =
    posY + 'px';

}



upBtn.onclick = ()=>{

  posY -= 5;

  updatePreview();

};



downBtn.onclick = ()=>{

  posY += 5;

  updatePreview();

};



leftBtn.onclick = ()=>{

  posX -= 5;

  updatePreview();

};



rightBtn.onclick = ()=>{

  posX += 5;

  updatePreview();

};



const savePositionBtn =
document.getElementById("savePositionBtn");



savePositionBtn.onclick = ()=>{

  update(settingsRef,{

    x: posX,

    y: posY

  });

  alert("Position Saved!");

};




</script>

</body>
</html>
